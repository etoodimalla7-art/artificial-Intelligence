<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn4.iconfinder.com/data/icons/small-n-flat/24/globe-64.png" type="image/x-icon"> <!-- This is the line to add your favicon -->
</head>
<body>
    <div class="container">

        <h1><b>Registration Form</b></h1>
        <form action="/submit" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Please choose an option--</option>
                <option value="math">Mathematics</option>
                <option value="science">Science</option>
                <option value="history">History</option>
                <option value="art">Art</option>
            </select><br>

            <!-- Wrapping buttons in a div with class 'button-group' -->
            <div class="button-group">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
    <script>

        // JavaScript to enhance user experience can be added here
        document.querySelector('form').addEventListener('submit', function(event) {
            alert('Thank you for registering!');
        });
        document.querySelector('form').addEventListener('reset', function(event) {
            alert('Form has been reset.');
        });
        document.getElementById('name').addEventListener('input', function(event) {
            console.log('Name input changed to: ' + event.target.value);
        });
        document.getElementById('email').addEventListener('input', function(event) {
            console.log('Email input changed to: ' + event.target.value);
        });
        document.getElementById('dob').addEventListener('input', function(event) {
            console.log('Date of Birth input changed to: ' + event.target.value);
        });
        document.getElementById('course').addEventListener('change', function(event) {
            console.log('Course selected: ' + event.target.value);
        });
        alert('Welcome to the Student Registration Form!');
        alert.window = 'Registration Form Loaded Successfully';
    
        document.getElementById('name').focus();
        document.getElementById('email').focus();
        document.getElementById('dob').focus();
        document.getElementById('course').focus();

    </script>
    
</body>
</html>
